<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Formulário</title>

</head>

<body>

    <main>

        <form>

            <label for="nome-completo">Nome Completo</label>
            <input type="text" id="nome-completo" name="nome-completo" required>

            <label for="email-usuario">E-mail Usuário</label>
            <input type="email" id="email-usuario" name="email-usuario" required>

            <label for="quantidade">Selecione a Quantidade</label>
            <select id="quantidade" name="quantidade">
                <option value="1">Um</option>
                <option value="2">Dois</option>
                <option value="3">Três</option>
            </select>

            <label for="navegador">Qual é o seu navegador de internet favorito?</label>
            <select id="navegador" name="navegador">
                <option value="chrome">Chrome</option>
                <option value="firefox">Firefox</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="other">Other</option>
            </select>

            <button type="submit">Enviar Pesquisa</button>

        </form>

    </main>

</body>

</html>
